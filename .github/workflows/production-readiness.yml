name: Production Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, Cloudflare build, D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: API tests
        run: pnpm --filter @workspace/api-server test

      - name: Account switching regression test
        run: pnpm --filter @workspace/daily-tasks-manager test:account-switch

      - name: Validate D1 migrations locally
        working-directory: artifacts/daily-tasks-manager
        run: pnpm exec wrangler d1 migrations apply daily-tasks-manager --local --config wrangler.jsonc

      - name: Build Cloudflare production bundle
        run: pnpm --filter @workspace/daily-tasks-manager build:cloudflare
