name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Frontend regression tests
        run: |
          pnpm --filter @workspace/daily-tasks-manager run test:account-switch
          pnpm --filter @workspace/daily-tasks-manager run test:hard-refresh
          pnpm --filter @workspace/daily-tasks-manager run test:habits

      - name: API tests
        run: pnpm --filter @workspace/api-server test

      - name: Production build
        run: pnpm run build
