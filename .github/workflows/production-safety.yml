name: Production safety

on:
  push:
    branches:
      - main
      - chatgpt/production-safety-current
      - chatgpt/productivity-speed-habits
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, migrations, and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Run API regression tests
        run: pnpm --filter @workspace/api-server test

      - name: Run account-switch regression test
        run: pnpm --filter @workspace/daily-tasks-manager test:account-switch

      - name: Run hard-refresh hydration regression test
        run: pnpm --filter @workspace/daily-tasks-manager test:hard-refresh

      - name: Run habit daily-reset regression tests
        run: pnpm --filter @workspace/daily-tasks-manager test:habits

      - name: Validate D1 migrations locally
        run: pnpm exec wrangler d1 migrations apply daily-tasks-manager --local --config artifacts/daily-tasks-manager/wrangler.jsonc

      - name: Build Cloudflare production bundle
        run: pnpm --filter @workspace/daily-tasks-manager run build:cloudflare

      - name: Verify Wrangler deployment config
        working-directory: artifacts/daily-tasks-manager
        run: pnpm exec wrangler deploy --dry-run
