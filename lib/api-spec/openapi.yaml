openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Daily task operations
  - name: spaces
    description: User-defined work spaces
  - name: events
    description: Countdown events
  - name: space-links
    description: Persistent links grouped by task space
  - name: onboarding
    description: New-account setup and starter templates
  - name: productivity
    description: Goals, habits, and study planning
  - name: notifications
    description: In-app announcements for users
  - name: admin
    description: Protected application administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /onboarding:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Get onboarding status for the signed-in account
      responses:
        "200":
          description: Current onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Create the account starter spaces and daily template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Completed onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
    patch:
      operationId: updateUsageType
      tags: [onboarding]
      summary: Change the signed-in account usage type without replacing existing data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageTypeUpdate"
      responses:
        "200":
          description: Updated account usage type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List daily tasks
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Task not found
  /tasks/{id}/copy:
    post:
      operationId: copyTask
      tags: [tasks]
      summary: Copy a task to one or more dates
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCopyInput"
      responses:
        "201":
          description: Copied tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
  /preferences/dashboard:
    get:
      operationId: getDashboardPreferences
      tags: [preferences]
      summary: Get dashboard layout preferences
      responses:
        "200":
          description: Dashboard layout preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardPreferences"
    patch:
      operationId: updateDashboardPreferences
      tags: [preferences]
      summary: Update dashboard layout preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardPreferencesUpdate"
      responses:
        "200":
          description: Updated dashboard layout preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardPreferences"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent in-app announcements
      responses:
        "200":
          description: Recent announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BroadcastNotification"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check whether the current account is the primary admin
      responses:
        "200":
          description: Admin access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get general application statistics
      responses:
        "200":
          description: Application statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Admin access required
  /admin/notifications:
    post:
      operationId: createAdminNotification
      tags: [admin]
      summary: Send an in-app announcement to all users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastNotificationInput"
      responses:
        "201":
          description: Announcement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastNotification"
        "403":
          description: Admin access required
  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Get task summary for a selected range
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary for the selected date or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
  /goals:
    get:
      operationId: listGoals
      tags: [productivity]
      summary: List account goals
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [productivity]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [productivity]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [productivity]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /habits:
    get:
      operationId: listHabits
      tags: [productivity]
      summary: List account habits
      responses:
        "200":
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [productivity]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [productivity]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [productivity]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /study-items:
    get:
      operationId: listStudyItems
      tags: [productivity]
      summary: List study plan items
      responses:
        "200":
          description: Study items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyItem"
    post:
      operationId: createStudyItem
      tags: [productivity]
      summary: Create a study item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyItemInput"
      responses:
        "201":
          description: Created study item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyItem"
  /study-items/{id}:
    patch:
      operationId: updateStudyItem
      tags: [productivity]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyItemUpdate"
      responses:
        "200":
          description: Updated study item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyItem"
    delete:
      operationId: deleteStudyItem
      tags: [productivity]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /spaces:
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List task spaces
      responses:
        "200":
          description: Task spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a task space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "201":
          description: Created space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "409":
          description: A space with this name already exists
  /spaces/{id}:
    patch:
      operationId: updateSpace
      tags: [spaces]
      summary: Update a task space
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceUpdate"
      responses:
        "200":
          description: Updated space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "404":
          description: Space not found
        "409":
          description: A space with this name already exists
    delete:
      operationId: deleteSpace
      tags: [spaces]
      summary: Delete a task space
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Space not found
  /space-links:
    get:
      operationId: listSpaceLinks
      tags: [space-links]
      summary: List persistent space links
      parameters:
        - name: spaceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Persistent space links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceLink"
    post:
      operationId: createSpaceLink
      tags: [space-links]
      summary: Create a persistent space link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceLinkInput"
      responses:
        "201":
          description: Created persistent link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceLink"
  /space-links/{id}:
    delete:
      operationId: deleteSpaceLink
      tags: [space-links]
      summary: Delete a persistent space link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Link not found
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List countdown events
      responses:
        "200":
          description: Countdown events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a countdown event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created countdown event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update a countdown event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated countdown event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a countdown event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Event not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UsageType:
      type: string
      enum: [student, employee, freelancer, personal]
    UsageTypeUpdate:
      type: object
      required: [usageType]
      properties:
        usageType:
          $ref: "#/components/schemas/UsageType"
    OnboardingStatus:
      type: object
      properties:
        completed:
          type: boolean
        usageType:
          oneOf:
            - $ref: "#/components/schemas/UsageType"
            - type: "null"
      required: [completed, usageType]
    OnboardingInput:
      type: object
      properties:
        usageType:
          $ref: "#/components/schemas/UsageType"
        taskDate:
          type: string
          format: date
      required: [usageType, taskDate]
    TaskCategory:
      type: string
      minLength: 1
    TaskLink:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
      required: [label, url]
    TaskFollowUp:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        dueDate:
          type: ["string", "null"]
      required: [id, title, completed, dueDate]
    TaskSubtask:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
      required: [id, title, completed]
    Task:
      type: object
      properties:
        id:
          type: integer
        taskDate:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
        notes:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        recurrence:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
          format: date
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSubtask"
        completed:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/TaskLink"
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/TaskFollowUp"
        sortOrder:
          type: integer
        startTime:
          type: ["string", "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: ["integer", "null"]
          minimum: 5
          maximum: 1440
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - taskDate
        - category
        - title
        - notes
        - completed
        - links
        - followUps
        - sortOrder
        - priority
        - recurrence
        - dueDate
        - subtasks
        - createdAt
        - updatedAt
    TaskInput:
      type: object
      properties:
        taskDate:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
          minLength: 1
        notes:
          type: string
        completed:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/TaskLink"
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/TaskFollowUp"
        sortOrder:
          type: integer
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        priority:
          type: string
          enum: [low, medium, high]
        recurrence:
          type: string
        dueDate:
          type: string
          format: date
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSubtask"
      required: [taskDate, category, title]
    TaskUpdate:
      type: object
      properties:
        taskDate:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
          minLength: 1
        notes:
          type: [string, "null"]
        completed:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/TaskLink"
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/TaskFollowUp"
        startTime:
          type: ["string", "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: ["integer", "null"]
          minimum: 5
          maximum: 1440
        priority:
          type: string
          enum: [low, medium, high]
        recurrence:
          type: [string, "null"]
        dueDate:
          type: [string, "null"]
          format: date
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSubtask"
        sortOrder:
          type: integer
    TaskCopyInput:
      type: object
      properties:
        dates:
          type: array
          minItems: 1
          maxItems: 31
          items:
            type: string
            format: date
      required: [dates]
    DashboardPreferences:
      type: object
      properties:
        visibleSections:
          type: array
          items: { type: string }
        sectionOrder:
          type: array
          items: { type: string }
      required: [visibleSections, sectionOrder]
    DashboardPreferencesUpdate:
      type: object
      properties:
        visibleSections:
          type: array
          maxItems: 20
          items: { type: string }
        sectionOrder:
          type: array
          maxItems: 20
          items: { type: string }
    Goal:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        target: { type: integer }
        current: { type: integer }
        deadline: { type: ["string", "null"], format: date }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, target, current, deadline, completed, createdAt, updatedAt]
    GoalInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        target: { type: integer, minimum: 1 }
        deadline: { type: ["string", "null"], format: date }
      required: [title]
    GoalUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        target: { type: integer, minimum: 1 }
        current: { type: integer, minimum: 0 }
        deadline: { type: ["string", "null"], format: date }
        completed: { type: boolean }
    Habit:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        frequency: { type: string, enum: [daily, weekly] }
        streak: { type: integer }
        lastCompleted: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
      required: [id, name, frequency, streak, lastCompleted, createdAt]
    HabitInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        frequency: { type: string, enum: [daily, weekly] }
      required: [name]
    HabitUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        frequency: { type: string, enum: [daily, weekly] }
        streak: { type: integer, minimum: 0 }
        lastCompleted: { type: ["string", "null"], format: date }
    StudyItem:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [subject, assignment, exam, review] }
        title: { type: string }
        subject: { type: ["string", "null"] }
        itemDate: { type: ["string", "null"], format: date }
        completed: { type: boolean }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, kind, title, subject, itemDate, completed, notes, createdAt]
    StudyItemInput:
      type: object
      properties:
        kind: { type: string, enum: [subject, assignment, exam, review] }
        title: { type: string, minLength: 1 }
        subject: { type: string }
        itemDate: { type: ["string", "null"], format: date }
        notes: { type: string }
      required: [kind, title]
    StudyItemUpdate:
      type: object
      properties:
        kind: { type: string, enum: [subject, assignment, exam, review] }
        title: { type: string, minLength: 1 }
        subject: { type: ["string", "null"] }
        itemDate: { type: ["string", "null"], format: date }
        completed: { type: boolean }
        notes: { type: ["string", "null"] }
    TaskSummary:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        remaining:
          type: integer
        byCategory:
          type: object
          additionalProperties:
            type: integer
      required: [total, completed, remaining, byCategory]
