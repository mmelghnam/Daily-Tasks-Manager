openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Daily task operations
  - name: spaces
    description: User-defined work spaces
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List daily tasks
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Task not found
  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Get daily task summary
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary for a day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
  /spaces:
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List task spaces
      responses:
        "200":
          description: Task spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a task space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "201":
          description: Created space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "409":
          description: A space with this name already exists
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TaskCategory:
      type: string
      minLength: 1
    TaskLink:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
      required: [label, url]
    Task:
      type: object
      properties:
        id:
          type: integer
        taskDate:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
        notes:
          type: ["string", "null"]
        completed:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/TaskLink"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - taskDate
        - category
        - title
        - notes
        - completed
        - links
        - createdAt
        - updatedAt
    TaskInput:
      type: object
      properties:
        taskDate:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
          minLength: 1
        notes:
          type: string
        completed:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/TaskLink"
      required: [taskDate, category, title]
    TaskUpdate:
      type: object
      properties:
        taskDate:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/TaskCategory"
        title:
          type: string
          minLength: 1
        notes:
          type: string
        completed:
          type: boolean
        links:
          type: array
          items:
            $ref: "#/components/schemas/TaskLink"
    TaskSummary:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        remaining:
          type: integer
        byCategory:
          type: object
          additionalProperties:
            type: integer
      required: [total, completed, remaining, byCategory]
    Space:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, name, color, description, createdAt]
    SpaceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
        description:
          type: string
      required: [name]